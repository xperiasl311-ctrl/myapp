<!DOCTYPE html><html><head><meta charset="utf-8"><title>AP Survivor Animated Demo</title><style>body{margin:0;text-align:center;font-family:Segoe UI;background:#eef4fb}canvas{border:3px solid #333;background:#fff;margin:10px auto;display:block}</style></head><body><h2>AP Survivor Animated Demo</h2><canvas id='g' width='1200' height='420'></canvas><script>const c=document.getElementById('g'),ctx=c.getContext('2d');let f=0,score=0,lives=5,over=false;let p={x:120,y:290,vy:0};let obs=[];document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&p.y>=290)p.vy=-15;});c.addEventListener('touchstart',()=>{if(p.y>=290)p.vy=-15;});setInterval(()=>{if(!over)obs.push({x:1220,type:Math.random()<0.5?'boss':'pay',rot:0});},1200);function dino(x,y){let leg=f%20<10;let tail=Math.sin(f*0.15)*8;ctx.strokeStyle='#2f7d32';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+5,y+45);ctx.lineTo(x-15-tail,y+35);ctx.stroke();ctx.fillStyle='#39a853';ctx.beginPath();ctx.ellipse(x+35,y+35,35,25,0,0,7);ctx.fill();ctx.fillRect(x+18,y+40,40,25);ctx.fillRect(x+48,y+18,20,16);ctx.fillStyle='white';ctx.fillRect(x+50,y+21,18,10);ctx.strokeRect(x+50,y+21,8,10);ctx.strokeRect(x+60,y+21,8,10);ctx.beginPath();ctx.moveTo(x+58,y+26);ctx.lineTo(x+60,y+26);ctx.stroke();ctx.fillStyle='#2f5597';ctx.fillRect(x+32,y+44,8,18);ctx.fillStyle='#8b5a2b';ctx.fillRect(x+62,y+48,16,12);ctx.font='12px Arial';ctx.fillText('📄',63+x,58+y-40);ctx.fillStyle='#39a853'; if(leg){ctx.fillRect(x+20,y+65,8,18);ctx.fillRect(x+44,y+60,8,23);}else{ctx.fillRect(x+20,y+60,8,23);ctx.fillRect(x+44,y+65,8,18);}}function boss(x,y){let bob=Math.sin(f*0.2)*5;ctx.font='54px serif';ctx.fillText('👩',x,y+35+bob);ctx.fillText('≈≈',x-5,y+bob);ctx.strokeRect(x+18,y+10+bob,10,8);ctx.strokeRect(x+31,y+10+bob,10,8);ctx.beginPath();ctx.moveTo(x+28,y+14+bob);ctx.lineTo(x+31,y+14+bob);ctx.stroke();ctx.fillStyle='#203a70';ctx.fillRect(x+18,y+42+bob,24,26);}function collide(o){return p.x+80>o.x&&p.x<o.x+60&&p.y+80>280;}function loop(){f++;ctx.clearRect(0,0,1200,420);let flash=(score>1200&&Math.floor(f/15)%2===0);ctx.fillStyle=flash?'#ffe3e3':'#ffffff';ctx.fillRect(0,0,1200,420);for(let i=0;i<12;i++){ctx.fillStyle='#dde5ee';ctx.fillRect(i*100,40,80,120);}ctx.fillStyle='#cfcfcf';ctx.fillRect(0,350,1200,70);p.vy+=0.8;p.y+=p.vy;if(p.y>290){p.y=290;p.vy=0;}dino(p.x,p.y);obs.forEach(o=>{o.x-=score>1200?12:8;if(o.type==='pay'){o.rot+=0.15;ctx.save();ctx.translate(o.x+20,315);ctx.rotate(o.rot);ctx.font='48px serif';ctx.fillStyle='red';ctx.fillText('💸',0,0);ctx.restore();}else boss(o.x,280);if(collide(o)){if(o.type==='pay'){lives--;o.x=-999;}else over=true;}});obs=obs.filter(o=>o.x>-100);score++;ctx.fillStyle='black';ctx.font='22px Segoe UI';ctx.fillText('Score '+Math.floor(score/10),20,30);ctx.fillText('Lives '+lives,20,60);if(score>1200){ctx.fillStyle='red';ctx.fillText('MONTH END MODE!',500,30);}if(lives<=0)over=true;if(over){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,1200,420);ctx.fillStyle='white';ctx.font='52px Segoe UI';ctx.fillText('GAME OVER',430,180);ctx.font='28px Segoe UI';ctx.fillText('Rachel, 可以入一入我房嗎？',390,240);}requestAnimationFrame(loop);}loop();</script></body></html>
